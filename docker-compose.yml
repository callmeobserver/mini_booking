version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_secret
      POSTGRES_DB: mini_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d mini_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini-booking-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://booking:booking_secret@postgres:5432/mini_booking?schema=public
      PORT: "4000"
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "4000:4000"

volumes:
  pgdata:
