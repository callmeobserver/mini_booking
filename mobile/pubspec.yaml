name: mobile
description: "Mini Booking System - Flutter Mobile & Desktop"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0

  # GraphQL
  graphql_flutter: ^5.1.2
  graphql: ^5.1.3

  # Navigation
  go_router: ^14.6.0

  # Dependency Injection
  get_it: ^8.0.0

  # Date formatting
  intl: ^0.20.0

  # Immutable data
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
